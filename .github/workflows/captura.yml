name: Captura programada

on:
  schedule:
    - cron: "0 14 * * *"   # diario 14:00 UTC = 08:00 hora de Colima
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # solo para hacer commit de data/ y calidad/

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Capturar fuentes
        id: captura
        run: python -m extractores.run_captura
        continue-on-error: true
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}

      - name: Limpiar y validar Plata y Oro
        id: pipeline
        if: steps.captura.outcome == 'success'
        continue-on-error: true
        run: python -m src.limpieza

      - name: Guardar datos y bitácora en el repositorio
        run: |
          git config user.name  "tdl-captura-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce data/plata data/oro data/cuarentena calidad/bitacora_captura.csv
          for ruta in calidad/bitacora_pipeline.csv calidad/e1; do
            if [ -e "$ruta" ]; then git add "$ruta"; fi
          done
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "captura: $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.event_name }})"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Marcar la ejecución como fallida si captura o pipeline fallaron
        if: steps.captura.outcome == 'failure' || steps.pipeline.outcome == 'failure'
        run: exit 1
